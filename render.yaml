services:
  # Backend API Service (Python FastAPI)
  - type: web
    name: nimbus-weather-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd artifacts/api-server/python && pip install -r requirements.txt
    startCommand: cd artifacts/api-server/python && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

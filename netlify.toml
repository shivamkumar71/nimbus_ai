# Netlify Configuration for SkyPulse Frontend Deployment

[build]
  base = "./"
  command = "pnpm install && pnpm -r --filter=@workspace/weather-app run build"
  publish = "artifacts/weather-app/dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect API calls to backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA routing - redirect all non-file requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Context-specific settings for production
[context.production]
  environment = { VITE_API_URL = "https://nimbus-weather-api.onrender.com/api" }

# Context-specific settings for deploy preview
[context.deploy-preview]
  environment = { VITE_API_URL = "https://nimbus-weather-api.onrender.com/api" }

# Context-specific settings for branch deploys
[context.branch-deploy]
  environment = { VITE_API_URL = "https://nimbus-weather-api.onrender.com/api" }
